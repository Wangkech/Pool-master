<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <title>Pool Master</title>
  </head>
  <body>
    <nav class="top-nav">
      <div class="nav-content">
        <div class="burger-btn">
          <div class="burger-btn-line" id="burger-btn-line1"></div>
          <div class="burger-btn-line" id="burger-btn-line2"></div>
          <div class="burger-btn-line" id="burger-btn-line3"></div>
        </div>
        <div class="logo-banner"><h1 class="logo">Pool Master</h1></div>
      </div>
    </nav>

    <section class="app-section">
      <!-- Create New Game Banner -->
      <div class="new-game-btn-container">
        <button class="new-game-btn">
          <img
            src="./assets/icons/Plus.svg"
            alt="New Game Button"
            class="new-game-btn-icon"
          />
        </button>
        <p class="new-game-btn-text">Start New Game</p>
      </div>
      <!-- Add player Modal -->
      <div class="add-player-modal-container">
        <form action="submit" class="add-player-form">
          <input
            type="text"
            class="player-name-input"
            placeholder="Enter Player Name...  "
          />
          <button type="submit" class="add-player-btn">
            <img src="./assets/icons/Plus.svg" alt="Add Player" />
          </button>
        </form>
        <ul class="players-list">
          <li class="player">
            <p class="player-index">1</p>
            <p class="player-name">Wangkech</p>
          </li>
          <li class="player">
            <p class="player-index">2</p>
            <p class="player-name">Gathoth</p>
          </li>
          <li class="player">
            <p class="player-index">3</p>
            <p class="player-name">Gatkuoth</p>
          </li>
          <li class="player">
            <p class="player-index">4</p>
            <p class="player-name">Hothnyang</p>
          </li>
          </li>
          <li class="player">
            <p class="player-index">4</p>
            <p class="player-name">Hothnyang</p>
          </li>
          </li>
          <li class="player">
            <p class="player-index">4</p>
            <p class="player-name">Hothnyang</p>
          </li>
          </li>
          <li class="player">
            <p class="player-index">4</p>
            <p class="player-name">Hothnyang</p>
          </li>
        </ul>

        <div class="modal-btns">
          <button class="cancel-btn">Cancel</button>
          <button class="okay-btn">Save</button>
        </div>
      </div>
    </section>

    <div class="bottom-nav">
      <button class="home-btn bottom-nav-btn">
        <img src="./assets/icons/Home.svg" alt="Home" srcset="" />
      </button>
      <button class="history-btn bottom-nav-btn">
        <img src="./assets/icons/History.svg" alt="HIstory" srcset="" />
      </button>
      <button class="settings-btn bottom-nav-btn">
        <img src="./assets/icons/gear.svg" alt="setings" srcset="" />
      </button>
    </div>

</html>
